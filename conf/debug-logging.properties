# On log à la fois sur la console et dans un fichier.
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler
# On peut configurer le ConsoleHandler, mais ici j'utilise sa configuration par défaut.
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# On configure notre FileHandler (il utilise lui aussi un SimpleFormatter).
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.pattern=R2.01-%u-%g.log
java.util.logging.FileHandler.append=true
# On change le format des logs pour notre SimpleFormatter.
# ( Format défini : [DATE] NIVEAU_LOG     | (NOM_LOGGER) SOURCE_METHODE | MESSAGE )
java.util.logging.SimpleFormatter.format=[%1$s] %4$-10s | (%3$s) %2$-15s | %5$s\n
# On limite tous les logs des composants à l'affichage des erreurs (SEVERE).
.level=SEVERE
# On active les logs du package tp6 sur WARNING.
# (donc les WARNING et les SEVERE s'afficheront pour le tp6)
tp6.level=INFO